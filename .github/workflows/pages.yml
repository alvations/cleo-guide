name: Deploy to GitHub Pages

# Publishes the field guide to GitHub Pages, serving the repository root as-is
# (index.html + .nojekyll), exactly as the README's "Deploy from a branch" setup
# would. This workflow exists because enabling Pages otherwise requires the repo
# Settings toggle; `configure-pages` with enablement:true turns Pages on via the
# API and then deploys. No build step — the artifact is the directory itself.

on:
  push:
    branches: ["claude/cleveland-page-creation-pant4l"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-flight run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact (repository root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
